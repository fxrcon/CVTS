<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Work | Central Valley Turnkey Services</title>
    <style>
        :root { 
            --primary: #002d62; 
            --secondary: #f39c12; 
            --accent: #2c3e50; 
            --light: #f4f7f6; 
            --white: #ffffff; 
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; color: #333; background: var(--light); line-height: 1.6; }
        
        nav { background: #1a1a1a; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        nav a:hover { color: var(--secondary); }

        header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid var(--secondary); }
        header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; text-transform: uppercase; }

        .container { max-width: 1000px; margin: auto; padding: 50px 20px; }
        h2 { color: var(--primary); text-align: center; font-size: 1.8rem; margin-bottom: 30px; border-bottom: 2px solid var(--secondary); display: inline-block; width: 100%; padding-bottom: 15px; text-transform: uppercase; }

        /* CAROUSEL STYLES */
        .carousel-container { position: relative; max-width: 800px; margin: auto; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .main-slide { display: none; text-align: center; }
        .main-slide img { width: 100%; height: 500px; object-fit: contain; background: #1a1a1a; }

        .prev, .next { cursor: pointer; position: absolute; top: 50%; width: auto; padding: 16px; margin-top: -22px; color: white; font-weight: bold; font-size: 20px; transition: 0.6s ease; border-radius: 0 3px 3px 0; user-select: none; background: rgba(0,0,0,0.5); text-decoration: none; }
        .next { right: 0; border-radius: 3px 0 0 3px; }
        .prev:hover, .next:hover { background-color: var(--secondary); }

        /* Thumbnail row */
        .thumb-row { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .column { cursor: pointer; opacity: 0.6; transition: 0.3s; }
        .column:hover, .active { opacity: 1; }
        .column img { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; }
        .active img { border-color: var(--secondary); }

        /* Bottom Section */
        .themed-bg { background: linear-gradient(rgba(0, 45, 98, 0.75), rgba(44, 62, 80, 0.75)), url('construccion2.jpg'); background-size: cover; background-position: center; color: white; text-align: center; padding: 60px 20px; border-top: 5px solid var(--secondary); margin-top: 50px; }
        .btn { padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; text-transform: uppercase; background: var(--secondary); color: white; }

        footer { text-align: center; padding: 40px 20px; background: #e2e8f0; font-size: 0.9rem; }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="photos.html">Photos</a>
    <a href="quote.html">Get a Quote</a>
</nav>

<header>
    <h1>Project Gallery</h1>
</header>

<div class="container">
    <h2>Recent Projects</h2>

    <div class="carousel-container">
        <div class="main-slide"><img src="photo1.jpg"></div>
        <div class="main-slide"><img src="photo2.jpg"></div>
        <div class="main-slide"><img src="photo3.jpg"></div>
        <div class="main-slide"><img src="photo4.jpg"></div>
        <div class="main-slide"><img src="photo5.jpg"></div>
        <div class="main-slide"><img src="photo6.jpg"></div>

        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>

    <div class="thumb-row">
        <div class="column"><img src="photo1.jpg" onclick="currentSlide(1)"></div>
        <div class="column"><img src="photo2.jpg" onclick="currentSlide(2)"></div>
        <div class="column"><img src="photo3.jpg" onclick="currentSlide(3)"></div>
        <div class="column"><img src="photo4.jpg" onclick="currentSlide(4)"></div>
        <div class="column"><img src="photo5.jpg" onclick="currentSlide(5)"></div>
        <div class="column"><img src="photo6.jpg" onclick="currentSlide(6)"></div>
    </div>
</div>

<section class="themed-bg">
    <h3>Quality Workmanship</h3>
    <a href="quote.html" class="btn">Get a Quote</a>
</section>

<footer>
    <p>&copy; 2026 Central Valley Turnkey Services | FXR Construction Inc. License #1005035</p>
</footer>

<script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
        showSlides(slideIndex += n);
    }

    function currentSlide(n) {
        showSlides(slideIndex = n);
    }

    function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("main-slide");
        let dots = document.getElementsByClassName("column");
        if (n > slides.length) {slideIndex = 1}
        if (n < 1) {slideIndex = slides.length}
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
        }
        slides[slideIndex-1].style.display = "block";
        dots[slideIndex-1].className += " active";
    }
</script>

</body>
</html>
