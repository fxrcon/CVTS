<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | CVTS - FXR Construction Inc.</title>
    <style>
        :root { --primary: #002d62; --secondary: #f39c12; --accent: #2c3e50; --light: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; color: #333; background: var(--light); line-height: 1.6; }
        nav { background: #1a1a1a; padding: 15px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 20px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        nav a:hover { color: var(--secondary); }
        header { background: var(--primary); color: white; padding: 25px; text-align: center; border-bottom: 5px solid var(--secondary); }
        
        .container { max-width: 700px; margin: 40px auto; padding: 40px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); border-bottom: 2px solid var(--secondary); padding-bottom: 10px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--accent); }
        input[type="text"], input[type="email"], input[type="tel"], textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;
        }
        input[type="file"] { padding: 10px 0; }
        .btn-submit { 
            background: var(--secondary); color: white; border: none; padding: 15px 30px; 
            font-weight: bold; width: 100%; border-radius: 5px; cursor: pointer; font-size: 1.1rem; transition: 0.3s;
        }
        .btn-submit:hover { background: #d68910; transform: translateY(-2px); }
        footer { text-align: center; padding: 20px; background: #ddd; margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="photos.html">Photos</a>
    <a href="quote.html">Get a Quote</a>
</nav>

<header>
    <h1>Request a Quote</h1>
</header>

<div class="container">
    <h2>Project Details</h2>
    
    <form action="https://formspree.io/f/mbdpkvaq" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="name" required placeholder="Your first and last name">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="(XXX) XXX-XXXX">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="email@company.com">
        </div>

        <div class="form-group">
            <label for="location">Project Location (City/Address)</label>
            <input type="text" id="location" name="location" required placeholder="Where is the job located?">
        </div>

        <div class="form-group">
            <label for="scope">Scope of Work / Description</label>
            <textarea id="scope" name="message" rows="5" required placeholder="Tell us more about the job requirements..."></textarea>
        </div>

        <div class="form-group">
            <label for="file-upload">Upload Plans or Photos (Optional)</label>
            <input type="file" id="file-upload" name="upload">
        </div>

        <input type="hidden" name="_subject" value="New Quote Request - CVTS Website">

        <button type="submit" class="btn-submit">SUBMIT QUOTE REQUEST</button>
    </form>
</div>

<footer>
    <p>&copy; 2026 Central Valley Turnkey Services | FXR Construction Inc. License #1005035</p>
</footer>

</body>
</html>
