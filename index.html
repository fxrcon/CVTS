<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Central Valley Turnkey Services</title>
    <style>
        :root { 
            --primary: #002d62; 
            --secondary: #f39c12; 
            --accent: #2c3e50; 
            --light: #f4f7f6; 
            --white: #ffffff; 
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            color: #333; 
            background: var(--light); 
            line-height: 1.6; 
        }
        
        /* Navegación */
        nav { background: #1a1a1a; padding: 15px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 20px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        nav a:hover { color: var(--secondary); }

        /* Cabecera con Branding */
        header { 
            background: var(--primary); 
            color: white; 
            padding: 35px 20px; 
            text-align: center; 
            border-bottom: 5px solid var(--secondary); 
        }
        header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
        .legal-sub { font-size: 0.9rem; color: #cbd5e0; margin-top: 5px; font-weight: normal; }
        .license { font-size: 0.75rem; color: #a0aec0; display: block; margin-top: 2px; }
        
        /* SECCIÓN HERO CON IMAGEN DE FONDO */
        .hero { 
            /* Capa oscura (gradiente) sobre la imagen construccion2.jpg */
            background: linear-gradient(rgba(0, 45, 98, 0.7), rgba(44, 62, 80, 0.7)), 
                        url('construccion2.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Efecto Parallax */
            color: white; 
            padding: 100px 20px; 
            text-align: center;
        }
        .hero h2 { 
            font-size: 2.5rem; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
        }
        .hero p { 
            font-size: 1.2rem; 
            opacity: 0.9; 
            margin-top: 0;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }

        /* Contenedor y Cuadros de Servicios */
        .container { max-width: 1100px; margin: auto; padding: 40px 20px; }
        h3 { 
            color: var(--primary); 
            text-align: center; 
            font-size: 1.8rem; 
            margin-bottom: 30px; 
            border-bottom: 2px solid var(--secondary); 
            display: inline-block; 
            width: 100%; 
            padding-bottom: 10px; 
        }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--white); padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h4 { color: var(--secondary); margin-top: 0; font-size: 1.3rem; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .card ul { padding-left: 20px; list-style-type: square; }
        
        /* Botones */
        .btn-group { margin-top: 25px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn { padding: 14px 28px; text-decoration: none; font-weight: bold; border-radius: 5px; transition: 0.3s; display: inline-block; font-size: 1rem; }
        .btn-orange { background: var(--secondary); color: white; border: none; }
        .btn-outline { background: transparent; color: white; border: 2px solid white; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
